      <!-- Session 43 (from Ravi's AI Studio fix): in AI Studio's preview the dev server's hot-reload
         socket ("vite-hmr") can't connect and threw "WebSocket closed without opened". Only that
         one socket is answered with a quiet stand-in; every other socket (Socket.IO chat, live
         refresh) uses the real WebSocket. A production build never opens a vite-hmr socket. -->
    <script>
      (function () {
        var Native = window.WebSocket;
        if (!Native || Native.__ybWrapped) return;
        function isHmr(p) { return p === "vite-hmr" || (Array.isArray(p) && p.indexOf("vite-hmr") !== -1); }
        function Quiet() {
          var self = this;
          this.readyState = 1; this.protocol = "vite-hmr"; this.url = "";
          this.onopen = null; this.onmessage = null; this.onclose = null; this.onerror = null;
          this.send = function () {}; this.close = function () { self.readyState = 3; };
          this.addEventListener = function (type, fn) {
            if (type === "open" && typeof fn === "function") setTimeout(function () { try { fn({ type: "open" }); } catch (e) {} }, 0);
          };
          this.removeEventListener = function () {};
          setTimeout(function () { if (typeof self.onopen === "function") { try { self.onopen({ type: "open" }); } catch (e) {} } }, 0);
        }
        function Wrapped(url, protocols) {
          if (isHmr(protocols)) return new Quiet();
          return protocols === undefined ? new Native(url) : new Native(url, protocols);
        }
        Wrapped.prototype = Native.prototype;
        Wrapped.CONNECTING = 0; Wrapped.OPEN = 1; Wrapped.CLOSING = 2; Wrapped.CLOSED = 3;
        Wrapped.__ybWrapped = true;
        window.WebSocket = Wrapped;
        window.addEventListener("unhandledrejection", function (e) {
          var m = e && e.reason && (e.reason.message || String(e.reason));
          if (m && /WebSocket closed without opened/i.test(m)) e.preventDefault();
        });
      })();
    </script>

    <script>
      (function () {
        var el = document.getElementById("yb-splash");
        var installed = false, seen = false;
        try {
          installed = window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          seen = sessionStorage.getItem("yb_splash_seen") === "1";
        } catch (e) {}
        if (!el || !installed || seen || window.innerWidth >= 768) { if (el) el.remove(); return; }
        try { sessionStorage.setItem("yb_splash_seen", "1"); } catch (e) {}
        el.hidden = false;
        var root = document.documentElement, meta = document.querySelector('meta[name="theme-color"]');
        root.style.backgroundColor = "#9B00FF"; if (meta) meta.setAttribute("content", "#9B00FF");
        var t0 = Date.now(), reduce = false, gone = false;
        try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
        var INTRO = reduce ? 300 : 2140;

          if (gone) return; gone = true; el.remove();
          try { window.dispatchEvent(new Event("ybex:splash-done")); } catch (e) {}
        }
        function exit(target) {
          if (gone || el.classList.contains("x")) return;
          var wait = Math.max(0, INTRO - (Date.now() - t0));
          setTimeout(function () {
            var p = el.querySelector(".p"), w = el.querySelector(".w");
            el.classList.add("x");
            w.style.transform = "translate(-50%,-50%) scale(.92)";           // Dip, 180 ms
            setTimeout(function () {
              var r = target && target.getBoundingClientRect && target.getBoundingClientRect();
              var ok = r && r.width > 40 && r.height > 20 && r.top >= 0 && r.bottom <= window.innerHeight;
              if (!ok || reduce) {                                            // no banner: plain fade
                el.style.transition = "opacity 280ms cubic-bezier(.22,1,.36,1)"; el.style.opacity = "0";
                el.style.pointerEvents = "none"; setTimeout(remove, 300); return;
              }
              var ease = "380ms cubic-bezier(.65,0,.35,1)";                    // Shrink to banner
              var rad = window.getComputedStyle(target).borderRadius || "20px";
              p.style.transition = "top " + ease + ",left " + ease + ",width " + ease + ",height " + ease + ",border-radius " + ease;
              p.style.top = r.top + "px"; p.style.left = r.left + "px";
              p.style.width = r.width + "px"; p.style.height = r.height + "px"; p.style.borderRadius = rad;
              var k = (r.width * 0.37) / w.getBoundingClientRect().width * 0.92;
              w.style.transition = "transform " + ease;
              w.style.transform = "translate(-50%,-50%) scale(" + k.toFixed(3) + ")";
              setTimeout(function () {                                        // Hand off to the real banner
                el.style.pointerEvents = "none";
                el.style.transition = "opacity 320ms cubic-bezier(.22,1,.36,1)"; el.style.opacity = "0";
                setTimeout(remove, 340);
              }, 400);
            }, 190);
          }, wait);
        }
        window.__ybSplash = { exit: exit, readyAt: t0 + INTRO };
        setTimeout(function () { exit(null); }, 9000);                       // never get stuck
        setTimeout(remove, 10500);
      })();
    </script>
